{% extends request.current_app_base_template %}

{% block content %}

    <h2>Upload</h2>

    <form method="POST" action="{% url 'new_json' %}" enctype="multipart/form-data">
        {% csrf_token %}
        {{ forms.json.upload_form }}
        <button type="submit">Submit</button>
    </form>

    <h2>Enter Directly</h2>

    <form method="POST" action="{% url 'new_json' %}" enctype="multipart/form-data">
        {% csrf_token %}
        {{ forms.json.text_form }}
        <button type="submit">Submit</button>
    </form>

    <h2>URL</h2>

    <form method="POST" action="{% url 'new_json' %}" enctype="multipart/form-data">
        {% csrf_token %}
        {{ forms.json.url_form }}
        <button type="submit">Submit</button>
    </form>

{% endblock %}
